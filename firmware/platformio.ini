; ---------------------------------------------------------------------------
; Info Wall — ESP32 firmware starter (PlatformIO / Arduino framework)
; Open this folder in VS Code with the PlatformIO extension, then Upload.
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ArduinoJson is used to parse the JSON the app sends over BLE.
; The ESP32 BLE stack (BLEDevice.h) ships with the espressif32 platform.
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
