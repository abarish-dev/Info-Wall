; ---------------------------------------------------------------------------
; Info Wall — ESP32 firmware (PlatformIO / Arduino framework)
; Target: Adafruit MatrixPortal S3 driving a 128x64 HUB75 LED matrix.
; Open this folder in VS Code with the PlatformIO extension, then Upload.
; If you use a plain ESP32 dev board instead, switch the [env] below to
; esp32dev and update the HUB75 GPIO pins in include/DisplayManager.h.
; ---------------------------------------------------------------------------
[env:adafruit_matrixportal_esp32s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
; On the MatrixPortal S3 (native USB), Serial reaches the USB-C port only when
; USB-CDC-on-boot is enabled. Do NOT force ARDUINO_USB_MODE here — let the
; Adafruit board default (TinyUSB) stand, or the serial port changes/disappears.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Libraries:
;  - ArduinoJson parses the JSON the app sends over BLE.
;  - ESP32-HUB75-MatrixPanel-DMA drives the HUB75 panel (DMA + Adafruit_GFX).
;  - The ESP32 BLE stack (BLEDevice.h) ships with the espressif32 platform.
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.11
    adafruit/Adafruit GFX Library@^1.11.9
