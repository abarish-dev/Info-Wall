; ---------------------------------------------------------------------------
; Info Wall — ESP32 firmware (PlatformIO / Arduino framework)
; Target: Adafruit MatrixPortal S3 driving a 128x64 HUB75 LED matrix.
; Open this folder in VS Code with the PlatformIO extension, then Upload.
; If you use a plain ESP32 dev board instead, switch the [env] below to
; esp32dev and update the HUB75 GPIO pins in include/DisplayManager.h.
; ---------------------------------------------------------------------------
[common]
base_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:adafruit_matrixportal_esp32s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
; On the MatrixPortal S3 (native USB), Serial reaches the USB-C port only when
; USB-CDC-on-boot is enabled. Do NOT force ARDUINO_USB_MODE here — let the
; Adafruit board default (TinyUSB) stand, or the serial port changes/disappears.
build_flags =
    ${common.base_flags}
    ; 1.3.0: main walls pinned explicitly to the 1.1.21 panel timing
    ; (library defaults: 8 MHz request -> div16, latch 4, min refresh 60, clkphase 0).
    -DPANEL_I2S_HZ=8000000
    -DPANEL_LATCH_BLANK=4
    -DPANEL_MIN_REFRESH=60
    -DPANEL_CLKPHASE=0

; Libraries:
;  - ArduinoJson parses the JSON the app sends over BLE.
;  - ESP32-HUB75-MatrixPanel-DMA drives the HUB75 panel (DMA + Adafruit_GFX).
;  - The ESP32 BLE stack (BLEDevice.h) ships with the espressif32 platform.
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.11
    adafruit/Adafruit GFX Library@^1.11.9

; ---------------------------------------------------------------------------
; Mom's Wall (simple-mode test builds). Same code; only the HUB75 timing
; differs, so main Info-Wall builds (env above) keep library-default timing.
; 1.2.14: 8 MHz pixel clock (160 MHz / 20), latch_blanking 4, ~130 Hz.
; ---------------------------------------------------------------------------
[env:mom_simple]
extends = env:adafruit_matrixportal_esp32s3
build_flags =
    ${common.base_flags}
    -DS3_LCD_DIV_NUM=20
    -DPANEL_I2S_HZ=8000000
    -DPANEL_LATCH_BLANK=4
    -DPANEL_MIN_REFRESH=100

; 1.2.14a: identical to mom_simple but clkphase flipped (data sampled on the
; other clock edge) - tests a setup/hold problem on the green lines.
[env:mom_simple_clkphase]
extends = env:mom_simple
build_flags =
    ${env:mom_simple.build_flags}
    -DPANEL_CLKPHASE=1
    -DINFOWALL_FW_TAG=\"a\"
